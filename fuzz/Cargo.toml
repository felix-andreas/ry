# The in-tree property fuzzers' invariants under libFuzzer, which follows branch coverage where
# deterministic-random inputs cannot. Needs nightly and cargo-fuzz (see contributing/testing.md).
# Every target wraps a battery its crate exports and its in-tree harness runs too.
[package]
name = "ry-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
syntax = { path = "../crates/syntax" }
format = { path = "../crates/format" }
semantics = { path = "../crates/semantics" }
ide = { path = "../crates/ide" }
interp = { path = "../crates/interp" }
loader = { path = "../crates/loader" }
sniff = { path = "../crates/sniff" }
table = { path = "../crates/table" }
libr = { path = "../crates/libr" }
# Only the `ry` binary uses mimalloc, so the targets skip building it.
ry-lang = { path = "../crates/ry", default-features = false }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantics"
path = "fuzz_targets/semantics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ide"
path = "fuzz_targets/ide.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interp_lower"
path = "fuzz_targets/interp_lower.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interp_unserialize"
path = "fuzz_targets/interp_unserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytecode"
path = "fuzz_targets/bytecode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_index"
path = "fuzz_targets/load_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reload"
path = "fuzz_targets/reload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "position"
path = "fuzz_targets/position.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unserialize"
path = "fuzz_targets/unserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lsp"
path = "fuzz_targets/lsp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

# Its own workspace: it needs nightly, so it stays out of the stable battery.
[workspace]

# Polars is a dependency, not a fuzzing subject, and at opt-level 3 with
# coverage instrumentation its largest crates need more memory than a 16GB
# machine has. A lower level without debug info keeps the build within it.
[profile.release.package.polars]
opt-level = 1
debug = false

[profile.release.package.polars-arrow]
opt-level = 1
debug = false

[profile.release.package.polars-compute]
