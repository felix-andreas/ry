[package]
name = "table"
description = "ry's built-in typed table type, an engine over Polars"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/table.rs"

[dependencies]
polars = { version = "0.55", default-features = false, features = [
    "lazy",
    "asof_join",
    "semi_anti_join",
    "cse",
    "csv",
    "parquet",
    "dtype-categorical",
    "cov",
    "round_series",
    "propagate_nans",
    "dtype-date",
    "fmt",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
polars-arrow = { version = "0.55", default-features = false }
thiserror.workspace = true

[dev-dependencies]
syntax = { path = "../syntax" }

[[bench]]
name = "db_benchmark"
harness = false
