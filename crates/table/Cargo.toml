[package]
name = "table"
description = "ry's built-in typed table type, an engine over Polars"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false
# `benches/allocator.rs` is a module the benchmarks share, not a benchmark.
autobenches = false

[lib]
path = "src/table.rs"

[dependencies]
polars = { version = "0.55", default-features = false, features = [
    "lazy",
    "asof_join",
    "semi_anti_join",
    "cse",
    "csv",
    "parquet",
    "dtype-categorical",
    "cov",
    "round_series",
    "propagate_nans",
    "dtype-date",
    "fmt",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    "cum_agg",
] }
polars-arrow = { version = "0.55", default-features = false }
# The kernels run on Polars' own thread pool, so `POLARS_MAX_THREADS` governs them too.
polars-core = { version = "0.55", default-features = false }
polars-buffer = { version = "0.55", default-features = false }
rayon = "1.12"
memmap2 = "0.9"
ryu = "1.0"
itoa = "1.0"
sniff = { path = "../sniff" }
rustc-hash.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The benchmarks run on the allocator and options `libR` gives the engine.
mimalloc = { version = "0.1", features = ["local_dynamic_tls", "v2"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
sniff = { path = "../sniff" }
syntax = { path = "../syntax" }

[[bench]]
name = "db_benchmark"
harness = false

[[bench]]
name = "ops_benchmark"
harness = false
