[package]
name = "heap"
description = "ry's R object model and garbage collector"
edition = "2024"
version.workspace = true
license = "UPL-1.0"
publish = false

[lib]
path = "src/heap.rs"

[dependencies]
rustc-hash.workspace = true
smallvec = { version = "1.15", features = ["union"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
syntax = { path = "../syntax" }
