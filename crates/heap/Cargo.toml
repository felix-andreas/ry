[package]
name = "heap"
description = "ry's R object model and garbage collector"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/heap.rs"

[dependencies]
hashbrown = "0.16"
libc = "0.2"
rustc-hash.workspace = true
smallvec = { version = "1.15", features = ["union"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[dev-dependencies]
syntax = { path = "../syntax" }
