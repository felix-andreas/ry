[package]
name = "loader"
edition = "2024"
license = "GPL-2.0-or-later"
version.workspace = true
publish = false

build = "build.rs"

[lib]
path = "src/loader.rs"

[features]
# The backend for ry's own runtime, which links the interpreter.
runtime = ["dep:heap", "dep:interp", "dep:rcmd"]

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = ["serde", "std"] }
heap = { path = "../heap", optional = true }
interp = { path = "../interp", optional = true }
rcmd = { path = "../rcmd", optional = true }
rustc-hash.workspace = true
notify = { version = "8", default-features = false }
salsa.workspace = true
semantics = { path = "../semantics" }
serde = { workspace = true, features = ["derive", "rc"] }
syntax = { path = "../syntax" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
