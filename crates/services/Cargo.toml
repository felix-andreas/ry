[package]
name = "services"
description = "Network services for ry's R interpreter: the HTTP client behind url() and download.file()"
edition = "2024"
version.workspace = true
license = "GPL-2.0-or-later"
publish = false

[lib]
path = "src/services.rs"

[dependencies]
interp = { path = "../interp" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
