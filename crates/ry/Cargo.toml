[package]
name = "ry-lang"
edition = "2024"
rust-version = "1.88"
version.workspace = true
description = "A language tool for R: a language server and CLI providing a static type checker, formatter, and linter."
license.workspace = true
repository.workspace = true
keywords = ["r", "language-server", "lsp", "formatter", "linter"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "ry"
path = "src/ry.rs"

[[bin]]
name = "ry"
path = "src/main.rs"

[features]
# Heap profilers such as massif only see the system allocator, so profiling builds drop it.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
clap.workspace = true
dirs = "6"
mimalloc = { version = "0.1", optional = true }
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
console.workspace = true
ignore.workspace = true
miette.workspace = true
rustc-hash.workspace = true
salsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_ignored = "0.1"
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true

format = { path = "../format" }
ide = { path = "../ide" }
loader = { path = "../loader" }
repl = { path = "../repl" }
semantics = { path = "../semantics" }
sniff = { path = "../sniff" }
syntax = { path = "../syntax" }

# async-lsp
async-lsp.workspace = true
tower.workspace = true
futures.workspace = true

[target.'cfg(not(unix))'.dependencies]
tokio-util.workspace = true

[dev-dependencies]
async-lsp.workspace = true
unicode-width.workspace = true
indoc.workspace = true
portable-pty = "0.9"
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower.workspace = true
