[package]
name = "typed"
description = "ry's typed core: native values, the typed IR and its ahead-of-time compiler"
edition = "2024"
version.workspace = true
license = "GPL-2.0-or-later"
publish = false

[lib]
path = "src/typed.rs"

[dependencies]
libc = "0.2"
heap = { path = "../heap" }
interp = { path = "../interp" }
rcmd = { path = "../rcmd" }
rustc-hash.workspace = true
smallvec = "1.15"
ssa = { path = "../ssa" }
stacker.workspace = true
syntax = { path = "../syntax" }

[dev-dependencies]
semantics = { path = "../semantics" }
