# Oracle cases that fail on main under one engine. `oracle compare` reports a listed failure as
# known instead of failing the run, and fails the run when a listed case passes, so whoever fixes
# one deletes its entry in the same change. Add an entry only for a failure that main already
# has, never for one your own change introduces. `provisional = true` marks a failure seen on a
# branch whose runtime code matches main but not yet confirmed on main itself.
# `intermittent = true` marks a crash under a gctorture engine that depends on the host or on
# timing: a run where the case passes counts it on its own summary line instead of failing.
#
# Each entry: `case` (the file name in cases/ without `.R`), `engine` (as `--engine` names it),
# `area` (the part of ry the bug lives in), and a one-line `reason`.

[[failure]]
case = "bytecode__finalizer_under_wide_window"
engine = "ry-gctorture-young"
area = "gc"
reason = "counts one finalizer run fewer than GNU R: prints 2 and 6 where GNU R prints 3 and 7"
provisional = true

[[failure]]
case = "jit__write_back_in_place"
engine = "ry-gctorture-young"
area = "interp"
reason = "aborts: reads an object the collector freed (heap/src/object.rs freed_object)"
provisional = true

[[failure]]
case = "kernels__elementwise"
engine = "ry-gctorture-young"
area = "interp"
reason = "aborts: reads an object the collector freed (heap/src/object.rs freed_object)"
provisional = true

[[failure]]
case = "s4__native_definitions"
engine = "ry-jit-gctorture"
area = "jit"
reason = "SIGSEGV when the engine loads base R from ry's own home (main e3bb8627, 4 of 4 runs); passes with GNU R's home"
provisional = true
intermittent = true
