[package]
name = "rcmd"
description = "ry's R home and R CMD front end: package installation, SHLIB builds and R CMD config"
edition = "2024"
version.workspace = true
license = "UPL-1.0"
publish = false
build = "../ry/build.rs"

[lib]
path = "src/rcmd.rs"

[[bin]]
name = "ry-rcmd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
libloading = "0.8"

[dev-dependencies]
syntax = { path = "../syntax" }
