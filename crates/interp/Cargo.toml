[package]
name = "interp"
description = "ry's R interpreter: language objects, the bytecode interpreter, and base R's internals"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/interp.rs"

[dependencies]
heap = { path = "../heap" }
syntax = { path = "../syntax" }
rowan.workspace = true
rustc-hash.workspace = true
regex.workspace = true
fancy-regex = { version = "0.20", features = ["leftmost_longest"] }
flate2 = "1"
lzma-rs = "0.3"
libc = "0.2"
stacker.workspace = true
unicode-width.workspace = true
lzma-rs = "0.3.0"
