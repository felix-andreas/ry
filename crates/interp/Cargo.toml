[package]
name = "interp"
description = "ry's R interpreter: language objects, the bytecode interpreter, and base R's internals"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/interp.rs"

[dependencies]
heap = { path = "../heap" }
smallvec = { version = "1.15", features = ["union"] }
syntax = { path = "../syntax" }
table = { path = "../table" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
rowan.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
regex.workspace = true
regex-automata = "0.4"
fancy-regex = { version = "0.20", features = ["leftmost_longest"] }
regex-syntax = "0.8"
flate2 = "1"
libc = "0.2"
stacker.workspace = true
unicode-width.workspace = true
bzip2 = "0.6"
lzma-rust2 = "0.24"
jiff = "0.2"
zstd = "0.13"
tiny-skia = "0.11"
ab_glyph = "0.2"
jpeg-encoder = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
encoding_rs = "0.8"
memchr = "2.7"

[target.'cfg(windows)'.dependencies]
glob = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
