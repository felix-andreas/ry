[package]
name = "libr"
description = "ry's implementation of R's C API, built as an ABI-compatible libR shared library"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
# `tests/harness.rs` is a module the test binaries share, not a test of its own.
autotests = false

# The shared library is `libR.so` (`libR.dylib`, `R.dll`), the name compiled packages link
# against, and its soname is set in build.rs. The rlib serves the crate's own unit tests.
[lib]
name = "R"
path = "src/libr.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bzip2-rs = "0.1.2"
flate2 = "1.1.9"
heap = { path = "../heap" }
libc = "0.2"
lzma-rs = "0.3.0"
rustc-hash.workspace = true
unicode-width.workspace = true
stacker.workspace = true

[build-dependencies]
cc = "1.2"

[dev-dependencies]
libloading = "0.8"
rcmd = { path = "../rcmd" }
syntax = { path = "../syntax" }

[[test]]
name = "test_native"
path = "tests/test_native.rs"

[[test]]
name = "test_gnu_r_binaries"
path = "tests/test_gnu_r_binaries.rs"

[[test]]
name = "test_fuzz_native"
path = "tests/test_fuzz_native.rs"

[[test]]
name = "test_corpus_binaries"
path = "tests/test_corpus_binaries.rs"

[[test]]
name = "test_altrep"
path = "tests/test_altrep.rs"

[[test]]
name = "test_altrep_api"
path = "tests/test_altrep_api.rs"

[[test]]
name = "test_serialize"
path = "tests/test_serialize.rs"

[[test]]
name = "test_serialize_native"
path = "tests/test_serialize_native.rs"

[[test]]
name = "test_connections"
path = "tests/test_connections.rs"

[[test]]
name = "test_connections_gnu_binary"
path = "tests/test_connections_gnu_binary.rs"

[[test]]
name = "test_install"
path = "tests/test_install.rs"

[[test]]
name = "test_headers"
path = "tests/test_headers.rs"

[[test]]
name = "test_corpus_calls"
path = "tests/test_corpus_calls.rs"

[[test]]
name = "test_numerics"
path = "tests/test_numerics.rs"
