[package]
name = "frames"
description = "The binding of ry's tables to R values: DataFrame, its expression API and the data viewer"
edition = "2024"
version.workspace = true
license = "GPL-2.0-or-later"
publish = false

[lib]
doctest = false
path = "src/frames.rs"

[dependencies]
heap = { path = "../heap" }
interp = { path = "../interp" }
table = { path = "../table" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
rustc-hash.workspace = true
serde_json.workspace = true

# The interpreter tests that need the data viewer or DataFrame live here rather than in interp,
# so that interp's own test binaries do not link Polars.
[dev-dependencies]
syntax = { path = "../syntax" }
libc = "0.2"
