[package]
name = "graphics"
description = "R's graphics engine, base graphics, plotmath and the built-in devices for ry's R interpreter"
edition = "2024"
version.workspace = true
license = "GPL-2.0-or-later"
publish = false

[lib]
path = "src/graphics.rs"

[dependencies]
heap = { path = "../heap" }
interp = { path = "../interp" }
syntax = { path = "../syntax" }
libc = "0.2"
flate2 = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
jpeg-encoder = "0.7"
bincode = { version = "2.0.1", default-features = false, features = ["derive", "std"] }
