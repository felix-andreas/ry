[package]
name = "repl"
edition = "2024"
license = "UPL-1.0"
version.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/repl.rs"

[dependencies]
# Pinned to reedline's own crossterm so the console and the editor share one
# terminal reader. `use-dev-tty` swaps crossterm's mio reader, which waits on an
# edge-triggered epoll but returns after one 1 KiB read, for a level-triggered
# `poll`: under mio the rest of a paste sits unread until another key arrives or
# a cursor-position query times out after two seconds.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
dirs = "6"
libloading = "0.8"
nu-ansi-term.workspace = true
rcmd = { path = "../rcmd" }
reedline.workspace = true
syntax = { path = "../syntax" }
zstd = "0.13"

[build-dependencies]
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"

# Its `main` either drives sessions or, when the driver starts it as a child, runs the console
# on its own main thread, which R requires.
[[test]]
name = "test_console_session"
harness = false
