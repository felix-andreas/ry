[package]
name = "repl"
edition = "2024"
version.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/repl.rs"

[dependencies]
# Terminal size only. Pinned to reedline's own crossterm so the console and
# the width probe cannot disagree about the terminal they share.
crossterm = "0.28"
dirs = "6"
libloading = "0.8"
nu-ansi-term.workspace = true
reedline.workspace = true
syntax = { path = "../syntax" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
