[package]
name = "zed_ry"
# Equals extension.toml's version (the one Zed publishes); `just bump-version` sets both to the
# release version without its `-beta` suffix.
version = "0.5.0"
edition = "2024"
license = "MIT"

# Its own workspace: the stable toolchain cannot read the root manifest's profile `rustflags`.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
