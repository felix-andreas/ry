# Inactive: ci.yml widened to the whole workspace, staged here because agent tokens lack the
# `workflow` scope. A human activates it with `git mv .github/pending-ci.yml .github/workflows/ci.yml`
# after the blockers in .agents/memory/backlog.md.

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      # `zed_ry` needs a wasm toolchain.
      - name: clippy
        run: cargo clippy --workspace --exclude zed_ry --all-targets --all-features -- -D warnings
      - name: build
        run: cargo build --workspace --exclude zed_ry --all-targets --all-features
      - name: test
        run: cargo test --workspace --exclude zed_ry --all-targets --all-features
      - name: doctests
        run: cargo test --workspace --exclude zed_ry --doc --all-features

  # Only the deterministic assertions gate; timings and memory are printed, so runner variance
  # cannot flake the build.
  extended:
    name: ignored benches + fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ignored suites (release)
        run: cargo test --release --workspace --exclude zed_ry --all-targets --all-features -- --ignored --nocapture
