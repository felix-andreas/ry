# The job runs what `just gate` runs, one recipe per step so a failure names its stage. It runs only
# when started by hand (user decision): the orchestrating agent starts it on main at its hourly
# check when main has new commits.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # Reads rust-toolchain.toml for the pinned nightly and its components, and caches the build.
      # An empty `rustflags` matches `just gate`, where clippy's `-D warnings` is the warning gate.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # The oracle's expectations are GNU R 4.6.2 output, the release ry bundles as its base R, so
      # the runtime's suites load base R from that release through R_HOME.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - name: R_HOME
        run: echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
      # rlang at exactly the release ry's native trace_back follows (FAST_PATHS in
      # crates/interp/src/package_fast_paths.rs), so the rlang oracle cases, the
      # native-package-functions scenario and the trace_back fuzz harness run instead of skipping.
      # Bump it together with that table.
      - name: rlang
        run: |
          Rscript -e '
            version <- "1.3.0"
            urls <- sprintf(c("https://cloud.r-project.org/src/contrib/rlang_%s.tar.gz",
                              "https://cloud.r-project.org/src/contrib/Archive/rlang/rlang_%s.tar.gz"), version)
            for (url in urls) {
              try(install.packages(url, repos = NULL, type = "source"))
              if (requireNamespace("rlang", quietly = TRUE)) break
            }
            stopifnot(identical(format(packageVersion("rlang")), version))
          '
      # libR links zlib, bzip2 and xz, as GNU R's does (crates/libr/build.rs).
      - name: link libraries
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev
      # The locales oracle cases switch to (`# oracle: requires locale`); a case whose locale is
      # missing does not run.
      - name: oracle locales
        run: sudo bash tools/oracle-locales.sh
      # ry's own base R, for the scenarios that hide GNU R (`hide gnu-r`).
      - name: base R
        run: just base-r dev
      - name: rustfmt
        run: just fmt-check
      - name: clippy
        run: just clippy
      - name: tests
        run: just battery
