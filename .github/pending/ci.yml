# The job runs what `just gate` runs, one recipe per step so a failure names its stage. It runs only
# when started by hand (user decision): the orchestrating agent starts it on main at its hourly
# check when main has new commits.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # Reads rust-toolchain.toml for the pinned nightly and its components, and caches the build.
      # An empty `rustflags` matches `just gate`, where clippy's `-D warnings` is the warning gate.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # The oracle's expectations are GNU R 4.3.3 output, so the runtime's suites load base R from
      # that release through R_HOME, which makes ry's runtime emulate it. 4.3.3 is also the oldest
      # version the runtime supports.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - name: R_HOME
        run: echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
      # libR links zlib, bzip2 and xz, as GNU R's does (crates/libr/build.rs).
      - name: link libraries
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev
      # ry's own base R, for the scenarios that hide GNU R (`hide gnu-r`).
      - name: base R
        run: just base-r dev
      - name: rustfmt
        run: just fmt-check
      - name: clippy
        run: just clippy
      - name: tests
        run: just battery
