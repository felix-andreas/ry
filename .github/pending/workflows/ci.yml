# Staged here because the agents' token cannot write .github/workflows. It replaces the live ci.yml.
# Activate it, together with the release workflow beside it, from the repository root:
#
#   git mv -f .github/pending/workflows/* .github/workflows/ && rm -r .github/pending
#
# The job runs what `just gate` runs, one recipe per step so a failure names its stage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # Reads rust-toolchain.toml for the pinned nightly and its components, and caches the build.
      # An empty `rustflags` matches `just gate`, where clippy's `-D warnings` is the warning gate.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # The runtime's tests run R code on ry's runtime, which reads base R from a GNU R
      # installation; without one they skip and nothing of the runtime is tested. 4.3.3 is the
      # oldest version the runtime supports, and the one the suites are maintained against.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      # libR links zlib, bzip2 and xz, as GNU R's does (crates/libr/build.rs).
      - name: link libraries
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev
      - name: rustfmt
        run: just fmt-check
      - name: clippy
        run: just clippy
      - name: tests
        run: just battery
