# Staged here because the agents' token cannot write .github/workflows. Activate it, together with
# the CI workflow beside it, from the repository root:
#
#   git mv -f .github/pending/workflows/* .github/workflows/ && rm -r .github/pending
#
# A release runs when a version tag is pushed (`git tag 0.4.0-beta && git push origin 0.4.0-beta`)
# or when someone starts it from the Actions tab with a version. With `publish` unticked it builds
# and smoke-tests every archive without publishing anything. The checklist and the one-time
# Marketplace setup are in docs/src/content/docs/contributing/releasing.md.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (must equal workspace.package.version)"
        required: true
      publish:
        description: "Publish the GitHub release and the VS Code extension (unticked builds and smoke-tests only)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the Linux archive needs no newer glibc than 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          # gnullvm links the UCRT, as Rtools-built packages do, so ry.exe, R.dll and package DLLs
          # share one C runtime.
          - { os: windows-latest, target: x86_64-pc-windows-gnullvm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: versions match the release
        run: |
          workspace=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          extension=$(sed -n 's/^[[:space:]]*"version": "\(.*\)",$/\1/p' editors/code/package.json | head -n 1)
          zed=$(sed -n 's/^version = "\(.*\)"/\1/p' editors/zed/extension.toml)
          if [ "$workspace" != "$VERSION" ] || [ "$extension" != "${VERSION%%-*}" ] || [ "$zed" != "${VERSION%%-*}" ]; then
            echo "::error::releasing $VERSION, but Cargo.toml is at $workspace, the VS Code extension at $extension and the Zed extension at $zed; run \`just bump-version $VERSION\` first"
            exit 1
          fi
          just release-kind "$VERSION" >/dev/null
      # Reads rust-toolchain.toml, so the release builds with the pinned nightly. An empty
      # `rustflags` keeps the action's `-D warnings` from failing a release over a warning.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          target: ${{ matrix.target }}
      # GNU R for the smoke test: ry's runtime reads base R from an installation.
      - uses: r-lib/actions/setup-r@v2
      # The gnullvm target needs an LLVM mingw toolchain: clang to compile libr's C and drive lld,
      # the UCRT import libraries, llvm-objdump for `just package`'s import check, and windres for
      # ry.exe's UTF-8 manifest (crates/ry/build.rs). MSYS2's clang64 environment is that
      # toolchain. It goes on PATH after setup-r, so its clang comes before anything Rtools puts
      # there.
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-toolchain
      - name: mingw toolchain
        if: runner.os == 'Windows'
        run: |
          printf '%s\n' '${{ steps.msys2.outputs.msys2-location }}\clang64\bin' >> "$GITHUB_PATH"
          {
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=clang"
            echo "CC_x86_64_pc_windows_gnullvm=clang"
            echo "AR_x86_64_pc_windows_gnullvm=llvm-ar"
            echo "WINDRES=llvm-windres"
          } >> "$GITHUB_ENV"
      # libR links zlib, bzip2 and xz on Linux, as GNU R's does (crates/libr/build.rs).
      - name: link libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev
      - name: package
        run: just package "$VERSION" ${{ matrix.target }}
      # RY_SMOKE_PACKAGES installs jsonlite with GNU R and loads it under `ry run`: a CRAN binary on
      # macOS, which proves ry rebinds a GNU R package's libR to its own runtime, a CRAN binary
      # built with Rtools on Windows, which proves such a DLL binds to ry's R.dll, and a source
      # build on Linux.
      - name: smoke test
        env:
          RY_SMOKE_PACKAGES: "1"
        run: tools/smoke-test.sh "release/$VERSION/ry-${{ matrix.target }}".*
      - uses: actions/upload-artifact@v4
        with:
          name: ry-${{ matrix.target }}
          path: |
            release/${{ env.VERSION }}/ry-${{ matrix.target }}.tar.gz
            release/${{ env.VERSION }}/ry-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release (and its tag, for a run started by hand).
      contents: write
      # Lets vsce trade a GitHub OIDC token for a short-lived Marketplace credential (trusted
      # publishing), so no Marketplace token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      # vsce 4.1, which publishes with trusted publishing, needs node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release/${{ env.VERSION }}
          merge-multiple: true
      - name: unpack the archives for the platform extensions
        run: |
          cd "release/$VERSION"
          for archive in ry-*.tar.gz; do
            mkdir -p "${archive%.tar.gz}" && tar -xzf "$archive" -C "${archive%.tar.gz}"
          done
          for archive in ry-*.zip; do
            mkdir -p "${archive%.zip}" && unzip -q "$archive" -d "${archive%.zip}"
          done
      # One extension per platform, bundling that archive's `ry`, runtime and `ry-rcmd`, plus
      # `ry.vsix` without a binary for every other platform.
      - name: package the VS Code extension
        run: |
          kind=$(just release-kind "$VERSION")
          dir=release/$VERSION
          (cd editors/code && bun install --frozen-lockfile)
          just build-extension "$kind" --out "../../$dir/ry.vsix"
          just build-platform-vsix x86_64-unknown-linux-gnu linux-x64 "$dir" "$kind"
          just build-platform-vsix aarch64-apple-darwin darwin-arm64 "$dir" "$kind"
          just build-platform-vsix x86_64-pc-windows-gnullvm win32-x64 "$dir" "$kind"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [ "$(just release-kind "$VERSION")" = pre-release ] && prerelease="--prerelease"
          assets=("release/$VERSION"/ry-*.tar.gz "release/$VERSION"/ry-*.zip "release/$VERSION"/*.vsix)
          # A rerun after a later step failed finds the release already there and refreshes its assets.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" --clobber "${assets[@]}"
            exit 0
          fi
          gh release create "$VERSION" $prerelease --target "$GITHUB_SHA" --title "ry $VERSION" \
            --notes "See the [news page](https://ry-lang.org/news/) for what changed." "${assets[@]}"
      # Trusted publishing (`--oidc`) needs vsce 4.1 and a policy for this workflow on the
      # publisher's Marketplace page. A VSCE_PAT secret, if set, is used instead; Azure DevOps
      # retires the global token it must be on December 1, 2026. Packaging stays on the locked vsce,
      # because 4.1 rejects bun's node_modules layout when it lists dependencies, and publishing a
      # finished .vsix lists none. `--skip-duplicate` lets a rerun finish a partly published release.
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          options=(--skip-duplicate)
          [ "$(just release-kind "$VERSION")" = pre-release ] && options+=(--pre-release)
          [ -z "$VSCE_PAT" ] && options+=(--oidc)
          for vsix in "release/$VERSION"/ry-*.vsix "release/$VERSION"/ry.vsix; do
            npx --yes @vscode/vsce@4.1.0 publish "${options[@]}" --packagePath "$vsix"
          done
