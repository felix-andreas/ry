<title id="t">ry speed-up over GNU R by benchmark suite</title>
<desc id="d">Geometric mean speed-up over GNU R. Public R JIT benchmarks: GNU R 1.00x, ry 2.66x; Package test suites: GNU R 1.00x, ry 1.91x; Numeric kernels: GNU R 1.00x, ry 4.82x, ry typed 14x; Application workloads: GNU R 1.00x, ry 1.95x, ry typed 21x.</desc>
