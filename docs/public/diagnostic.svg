<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 292" width="814" height="292" role="img" aria-labelledby="title desc">
<title id="title">ry check reports a match that misses a case</title>
<desc id="desc">$ ry check payment.R
non-exhaustive-match

  × this `match` does not handle `:Pending`: add an arm for it, or a catch-all `_ =&gt; ...` arm
   ──[payment.R:7:3]
 6 │ balance &lt;- function(payment: Payment) -&gt; double {
 7 │   match (payment) {
   │   ^^^^^^^^^^^^^^^
 8 │     :Paid(amount = a) =&gt; a
  help: Add an arm for `:Pending` (`ry check --fix --unsafe-fixes` applies it)

1 problem in 1 file
1 fixable with `ry check --fix --unsafe-fixes`</desc>
<style>
.bg { fill: #f6f8fa; stroke: #d0d7de; }
