[workspace]
resolver = "3"
members = ["crates/*", "legacy/*", "editors/zed"]
default-members = ["crates/ry"]

# The release pipeline cross-links the macOS binaries with zig, which has no
# Apple SDK: any dependency that emits `-framework ...` fails the link. The
# real iana-time-zone links CoreFoundation on macOS; the stub keeps the
# product graph framework-free (see patches/iana-time-zone).
[patch.crates-io]
iana-time-zone = { path = "patches/iana-time-zone" }

[workspace.package]
version = "0.3.1-beta"
license = "UPL-1.0"
repository = "https://github.com/felix-andreas/ry"

[workspace.dependencies]
clap = { version = "4.5.40", features = ["derive"] }
console = "0.16.0"
unicode-width = "0.2"
ignore = "0.4.23"
indoc = "2.0.6"
itertools = "0.14.0"
miette = { version = "7.6.0", default-features = false, features = [
    "fancy-no-backtrace",
] }
ropey = "1.6.1"
rustc-hash = "2.1.1"
serde = "1.0.219"
serde_json = "1.0.140"
similar = { version = "2.7.0", features = ["inline"] }
stacker = "0.1.24"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "time",
] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-tree = "0.4.0"
tree-sitter = "0.25.6"
tree-sitter-r = "1.3.0"

# Greenfield-rewrite substrates (decisions.md "target architecture"). Salsa is deliberately
# pinned to one minor version — its API has a history of breaking releases; upgrade on purpose,
# never as a side effect of `cargo update`.
rowan = "0.16.1"
salsa = "=0.28.0"


# async-lsp
async-lsp = { version = "0.2.2", features = ["tokio"] }
tower = { version = "0.5.2" }
futures = { version = "0.3.31" }

# repl
reedline = "0.40.0"
nu-ansi-term = "0.50.1"

# dev-dependencies
regex = "1.11.1"

# cfg(not(unix)) dependencies
tokio-util = { version = "0.7.15", features = ["compat"] }

[profile.dev.package]
similar.opt-level = 3
tree-sitter.opt-level = 3
tree-sitter-r.opt-level = 3

[profile.release]
strip = true
lto = true

# Release performance with symbols and frame pointers kept, for profilers (perf, callgrind, gdb
# sampling): `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = true
