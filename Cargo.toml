[workspace]
resolver = "3"
members = ["crates/*", "editors/zed"]
default-members = ["crates/ry"]

# zig cross-links macOS without an Apple SDK, and the real crate links CoreFoundation.
[patch.crates-io]
iana-time-zone = { path = "patches/iana-time-zone" }

[workspace.package]
version = "0.4.1-beta"
repository = "https://github.com/felix-andreas/ry"

[workspace.dependencies]
clap = { version = "4.5.40", features = ["derive"] }
console = "0.16.0"
unicode-width = "0.2"
ignore = "0.4.23"
indoc = "2.0.6"
miette = { version = "7.6.0", default-features = false, features = [
    "fancy-no-backtrace",
] }
rustc-hash = "2.1.1"
foldhash = "0.2"
serde = "1.0.219"
serde_json = "1.0.140"
similar = { version = "2.7.0", features = ["inline"] }
stacker = "0.1.24"
thin-vec = "0.2.18"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "time",
] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-tree = "0.4.0"
tree-sitter = "0.25.6"
tree-sitter-r = "1.3.0"

text-size = "1.1.1"
boxcar = "0.2.14"
hashbrown = { version = "0.17", default-features = false }
# Pinned: salsa breaks its API between minor releases, so upgrade on purpose.
salsa = "=0.28.5"

async-lsp = { version = "0.2.2", features = ["tokio"] }
tower = { version = "0.5.2" }
futures = { version = "0.3.31" }

reedline = "0.40.0"
nu-ansi-term = "0.50.1"

regex = "1.11.1"

tokio-util = { version = "0.7.15", features = ["compat"] }

# Full debug info makes every interp and libr test binary close to a gigabyte, and a workspace
# test run links dozens of them, which fills a 16 GB machine's disk and slows every link. Line
# tables keep backtraces and profiles symbolized; set CARGO_PROFILE_DEV_DEBUG=true to step
# through locals in a debugger.
[profile.dev]
debug = "line-tables-only"

# Dependency debug info, mostly Polars, runs to tens of gigabytes per build and
# slows every link, while backtraces through workspace code stay intact without it.
[profile.dev.package]
"*".debug = false
similar.opt-level = 3
tree-sitter.opt-level = 3
tree-sitter-r.opt-level = 3
# The JIT compiles while the program runs, so an unoptimized code generator makes debug runs of
# hot R code slower than interpreting it.
cranelift-codegen.opt-level = 3
cranelift-frontend.opt-level = 3
cranelift-entity.opt-level = 3
cranelift-bforest.opt-level = 3
cranelift-bitset.opt-level = 3
cranelift-control.opt-level = 3
cranelift-jit.opt-level = 3
cranelift-module.opt-level = 3
regalloc2.opt-level = 3
# Collection stress and the oracle's collection torture collect on every allocation, so an
# unoptimized collector makes those runs in a debug build take minutes per case. Debug assertions
# and overflow checks stay on.
heap.opt-level = 2

[profile.release]
strip = true
lto = true

# `cargo bench` and `cargo test-release` (`cargo test --profile bench`) build with this profile.
# Fat LTO of a test binary that links polars or libr needs more memory than a 16 GB machine has, so
# tests use thin local LTO and parallel codegen. Plain `cargo test --release` still uses the release
# profile. Shipped binaries and the benchmark numbers in the docs come from `cargo build --release`,
# which keeps fat LTO.
[profile.bench]
inherits = "release"
lto = false
codegen-units = 16

# Release performance with symbols kept for profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = true

# Full debug info for polars needs more memory than a 16 GB machine has, and line tables are
# enough to symbolize a profile of a dependency.
[profile.profiling.package."*"]
debug = "line-tables-only"
