id = "typed"
name = "Typed ry against Rust"
summary = "typed kernels and applications, each timed beside the same program written in Rust"
description = """
The typed version of every numeric kernel and application workload, timed against the same program
written in Rust. The Rust twin of `<name>.typed.R` is `tools/bench/typed/<name>.rs`: the same
algorithm on the same sizes, in the data model a Rust programmer would pick (a `Vec<f64>` for a
`List<F64>`, a struct for a record, an enum for a tagged union), and where a twin's data model
differs further, its header comment says how. Rust is the baseline here, so a ratio is typed ry's
time over Rust's: 1x is Rust's speed, and lower is faster.

Each Rust program is one file compiled with `rustc -O --edition 2024`. `-O` is optimization level
3, the level of cargo's release profile, and no flag names a target CPU, so the twin is built the
way a released Rust program is. Both harnesses, `tools/bench/harness.typed.R` and
`tools/bench/typed/harness.rs`, run the program once cold and five times warm inside one process
and report the median warm time, and a Rust program passes its inputs through `black_box`, which
keeps the compiler from computing the result ahead of the run. The two engines must print the same
checksum.
"""

