id = "appsuite"
name = "Application test suite"
summary = "sections of a test user's application test suite, each weighted by its share of GNU R's time there"
description = """
A workload modelled on the test suite of a large business application, which a test user measured on
GNU R and ry. It has 13 sections, one per kind of code the suite spends its time in, and each section
runs a number of rounds chosen so that its share of GNU R's time is the share that kind of code has
in the suite. The score is the workload's total time, because in a test suite time adds up. Beside it,
236 patterns reduced from the same suite time one kind of call each, in nanoseconds per call.
"""

[[groups]]
id = "sections"
name = "Workload sections"
description = "The 13 sections of app_workload.R. A section's time is the CPU time of its timed rounds, after a warm-up of a twentieth of them."

[[groups]]
id = "patterns"
name = "Patterns"
scored = false
description = "One kind of call each, timed in a loop that doubles its calls until a batch takes 0.3 s of CPU time; the time is per call."

[[programs]]
id = "bodies"
display = "Plain function bodies"
group = "sections"
summary = "Small functions with argument and type checks, defaults, list fields, guards and short loops."
source = "tools/bench/appsuite/app_workload.R"

[[programs]]
id = "objects"
display = "S4 objects"
group = "sections"
summary = "new() with initialize and validity, a replacement generic, is(), isVirtualClass(), slotNames() and slot()."
source = "tools/bench/appsuite/app_workload.R"

[[programs]]
id = "keys"
display = "String keys"
group = "sections"
summary = "paste, sprintf, %in%, match, unique, grepl and setdiff on short character vectors."
source = "tools/bench/appsuite/app_workload.R"

[[programs]]
id = "functionals"
display = "Functionals"
group = "sections"
summary = "lapply, sapply, vapply, Map, Reduce and do.call over a list of 10 numbers."
source = "tools/bench/appsuite/app_workload.R"

[[programs]]
id = "dates"
