id = "kernels"
name = "Numeric kernels (ours)"
harness = "tools/bench/harness.R"
summary = "small programs we wrote whose time goes into loops, recursion and arithmetic on numbers"
description = """
Programs written for ry's benchmarks, each the hot path of numeric code: scalar loops, recursion,
element loops over vectors, whole-vector arithmetic and small simulations, several taken from the
finance and biostatistics benchmark code bases. A program belongs here when its time goes into
arithmetic on numbers and numeric vectors; one whose time goes into lists, attributes, dispatch,
strings or tables is an application workload. Each is sized so GNU R takes 0.1 to 2 seconds per
run. A process runs the program once cold, then five times warm, and reports the median warm time,
so the time leaves out start-up, GNU R's byte compilation and ry's first tier-up. The result is
checked against GNU R's on every engine. Where a `<name>.typed.R` sits beside the program, the same
computation written in typed ry runs in strict mode as the ry typed column.
"""

[[programs]]
id = "array_dot"
display = "Dot product"
summary = "An element loop over a million doubles summing `x[[i]] * y[[i]]`, five times: scalar indexing and arithmetic."
source = "tools/bench/kernels/array_dot.R"
typed_source = "tools/bench/kernels/array_dot.typed.R"

