# The numeric kernels in the schema that `tools/bench/kernels/suite.toml` uses. The docs and
# `tools/bench/readme.py` read display names and summaries from here until the kernels move there.
id = "kernels"
name = "Numeric kernels (ours)"
summary = "small programs we wrote: loops, recursion, vector code and records"
harness = "tools/bench/why/untyped/harness.R"

[[programs]]
id = "array_sum"
display = "Sum over a vector"
summary = "Sums a million doubles element by element with `x[[i]]`: a counted loop with scalar indexing."
source = "tools/bench/why/untyped/array_sum.R"
typed_source = "tools/bench/why/typed/array_sum.R"

[[programs]]
id = "array_dot"
display = "Dot product"
summary = "The dot product of two vectors of a million doubles, element by element: two indexed reads per iteration."
source = "tools/bench/why/untyped/array_dot.R"
typed_source = "tools/bench/why/typed/array_dot.R"

[[programs]]
id = "array_filter"
display = "Filter and count"
summary = "Counts the items above one half in a million doubles: a loop with a branch in its body."
source = "tools/bench/why/untyped/array_filter.R"
typed_source = "tools/bench/why/typed/array_filter.R"

[[programs]]
id = "array_map"
display = "Map into a vector"
summary = "Writes `x[[i]] * 2 + 1` into a preallocated vector of a million doubles: indexed assignment in a loop."
source = "tools/bench/why/untyped/array_map.R"
typed_source = "tools/bench/why/typed/array_map.R"

[[programs]]
id = "bond_book"
display = "Bond book pricing"
summary = "Prices a book of bonds, each a short vector computation of `seq_len`, `rep`, `exp` and `sum`: many calls into base R."
source = "tools/bench/why/untyped/bond_book.R"
typed_source = "tools/bench/why/typed/bond_book.R"

[[programs]]
id = "closures"
display = "Closures and lapply"
summary = "Calls small closures in a loop, then `lapply` and `vapply` over a sequence: closure creation and call overhead."
source = "tools/bench/why/untyped/closures.R"
typed_source = "tools/bench/why/typed/closures.R"

[[programs]]
id = "drawdown"
display = "Drawdown and volatility"
summary = "Maximum drawdown and EWMA volatility in one pass over a return series, from the finance code base: scalar state carried through a loop."
source = "tools/bench/why/untyped/drawdown.R"
typed_source = "tools/bench/why/typed/drawdown.R"

[[programs]]
id = "expr_tree"
display = "Expression tree"
summary = "Builds an expression tree of sums, maxima and negations, then evaluates it: recursion over nested lists."
source = "tools/bench/why/untyped/expr_tree.R"
typed_source = "tools/bench/why/typed/expr_tree.R"

[[programs]]
id = "fib"
display = "Recursive Fibonacci"
summary = "`fib(30)`, about 2.7 million calls of a small recursive function: pure call overhead."
source = "tools/bench/why/untyped/fib.R"
typed_source = "tools/bench/why/typed/fib.R"

[[programs]]
id = "log_rank"
display = "Log-rank statistic"
summary = "The log-rank test statistic from the biostatistics code base: a loop over event times with whole-vector comparisons in its body."
source = "tools/bench/why/untyped/log_rank.R"
typed_source = "tools/bench/why/typed/log_rank.R"

[[programs]]
id = "loop_sum"
display = "Scalar loop"
summary = "A double accumulator in a counted loop: the simplest arithmetic loop."
source = "tools/bench/why/untyped/loop_sum.R"
typed_source = "tools/bench/why/typed/loop_sum.R"

[[programs]]
id = "orders"
display = "Order pricing"
summary = "Prices order lines with a loyalty discount and a regional tax, then totals the invoices: field access on records (named lists)."
source = "tools/bench/why/untyped/orders.R"
typed_source = "tools/bench/why/typed/orders.R"

[[programs]]
id = "report"
display = "Report formatting"
summary = "Formats one line per account, then joins and measures the report: `sprintf`, `paste` and string building."
source = "tools/bench/why/untyped/report.R"
typed_source = "tools/bench/why/typed/report.R"

[[programs]]
id = "sales"
display = "Sales table pipeline"
summary = "Filters a million sales rows, adds a revenue column and totals it per region: data frame subsetting and grouped sums."
source = "tools/bench/why/untyped/sales.R"
typed_source = "tools/bench/why/typed/sales.R"

[[programs]]
id = "validate"
display = "Row validation"
summary = "Parses `name,age,score,team` rows, rejects the invalid ones and totals the valid scores per team: `strsplit`, conversions and lists of results."
source = "tools/bench/why/untyped/validate.R"
typed_source = "tools/bench/why/typed/validate.R"

[[programs]]
id = "vasicek"
display = "Vasicek rate paths"
summary = "Simulates Vasicek interest-rate paths from the finance code base, one matrix row per step: vector arithmetic and matrix assignment."
source = "tools/bench/why/untyped/vasicek.R"
typed_source = "tools/bench/why/typed/vasicek.R"

[[programs]]
id = "vector_arith"
display = "Vector arithmetic"
summary = "Whole-vector arithmetic on a million doubles, repeated in a loop: time spent in vectorized builtins."
source = "tools/bench/why/untyped/vector_arith.R"
typed_source = "tools/bench/why/typed/vector_arith.R"
