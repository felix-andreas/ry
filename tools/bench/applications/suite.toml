id = "applications"
name = "Application workloads (ours)"
harness = "tools/bench/harness.R"
summary = "programs we wrote in the shape of package and business code: calls, dispatch, conditions, records, tables"
description = """
Programs written for ry's benchmarks in the shape of the code real R packages and analyses run:
validation at API boundaries, condition handling, S3, S4 and R6 objects, records as named lists,
string building, data frames and data.table, time series, and a testthat suite. Their time goes
into R's object and data machinery rather than into arithmetic, which is what separates them from
the numeric kernels. Each is sized so GNU R takes 0.1 to 2 seconds per run. A process runs the
program once cold, then five times warm, and reports the median warm time, so the time leaves out
start-up and loading packages. The result is checked against GNU R's on every engine. Where a
`<name>.typed.R` sits beside the program, the same computation written in typed ry runs in strict
mode as the ry typed column.
"""

[[programs]]
id = "bond_book"
display = "Bond book pricing"
summary = "Prices 200,000 bonds, each a short vector computation through seq_len, rep, exp and sum: many small base calls."
source = "tools/bench/applications/bond_book.R"
typed_source = "tools/bench/applications/bond_book.typed.R"

