id = "public"
name = "Public R JIT benchmarks"
summary = "standard programs from R compiler research (Ř, rcp)"
description = """
The programs are the benchmark suite that the Ř (rir) and rcp R compilers measure, the 57 programs of Kocourek, Křikava and Vitek's "Copy-and-Patch Just-in-Time Compiler for R" (VMIL 2025) minus three that cannot be sized to a few seconds. They are vendored unchanged from PRL-PRG/r-compile-server at commit b2b13a3150bddcc2d6dae8c37ecbbf1007170940 under its MIT licence, with the Benchmarks Game ports contributed by Leo Osvald and the Are We Fast Yet translations credited to Kalibera et al. Each file ends with a driver that runs the program once at a fixed size, chosen so that GNU R takes about 0.5 to 2 s, and prints its name, a checksum of its output and result, and its time. Each program runs once per fresh process from its own directory, so the time includes GNU R's byte compilation and ry's JIT tier-up, and its checksum must match GNU R's.
"""

[[groups]]
id = "awfy"
name = "Are We Fast Yet"
description = "R translations of programs from the Are We Fast Yet suite, which compares language implementations on the same small object and loop workloads. Bounce comes in three variants that differ in how a ball's fields are indexed."
url = "https://github.com/PRL-PRG/r-compile-server/tree/b2b13a3150bddcc2d6dae8c37ecbbf1007170940/client/rsh/inst/benchmarks/areWeFast"
license = "MIT"

[[groups]]
id = "shootout"
name = "Benchmarks Game"
description = "R ports of the Computer Language Benchmarks Game programs, each in several variants that range from idiomatic vectorized R to naive scalar loops. The input-reading programs read a FASTA file that the driver generates with fasta.R before timing starts."
url = "https://github.com/PRL-PRG/r-compile-server/tree/b2b13a3150bddcc2d6dae8c37ecbbf1007170940/client/rsh/inst/benchmarks/shootout"
license = "MIT"

[[groups]]
id = "rcp"
name = "rcp micro-benchmarks and convolutions"
description = "The 13 micro-benchmarks of the simple/ directory, each one tight loop that isolates an interpreter cost such as variable assignment, vector subassignment or closure calls, and the 3 convolution programs of RealThing/, which compute the same convolution with scalar loops or vector operations."
url = "https://github.com/PRL-PRG/r-compile-server/tree/b2b13a3150bddcc2d6dae8c37ecbbf1007170940/client/rsh/inst/benchmarks"
license = "MIT"

# Are We Fast Yet

[[programs]]
id = "bounce"
group = "awfy"
display = "Bouncing balls, named fields"
summary = "Moves 3,000 balls for 50 steps with lapply, reading and writing each ball's fields by name (ball['xVel'])"
source = "tools/bench/public/awfy/bounce.R"

[[programs]]
id = "bounce_nonames"
group = "awfy"
display = "Bouncing balls, positional fields"
summary = "Moves 10,000 balls for 50 steps with lapply, indexing each ball's fields by position and counting bounces through <<-"
source = "tools/bench/public/awfy/bounce_nonames.R"

[[programs]]
id = "bounce_nonames_simple"
group = "awfy"
display = "Bouncing balls, positional fields, simple setup"
summary = "Same as the positional variant, but each ball's four random numbers are drawn into locals before c() builds it"
source = "tools/bench/public/awfy/bounce_nonames_simple.R"

[[programs]]
id = "mandelbrot"
group = "awfy"
display = "Mandelbrot set, scalar loops"
summary = "Computes a 450 x 450 Mandelbrot bitmap checksum with nested scalar while loops, double arithmetic and bitwShiftL/bitwXor"
source = "tools/bench/public/awfy/mandelbrot.R"

[[programs]]
id = "storage"
group = "awfy"
display = "Tree allocation"
summary = "Recursively builds a depth-10 tree of 4-element lists with random leaves, stressing allocation, recursion and <<-"
source = "tools/bench/public/awfy/storage.R"

