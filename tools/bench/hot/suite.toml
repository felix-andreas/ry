id = "hot"
name = "Hot package entries"
summary = "package calls that dominate the benchmark code bases' time, replayed in a loop"
description = "Each program is one package entry that the three benchmark code bases spend much of their time in, with a few of the calls they make to it, captured with their arguments while the code bases' tests ran on ry. `tools/bench/hot/harness.R` replays every program's calls in batches of about 20 ms of GNU R time in one process per engine, with every package the code bases import loaded (`session`). A program's weight in a code base is its share of the code base's GNU R time, and the predicted speed-up of a code base is the weighted harmonic mean of its programs' speed-ups.\n"
session = ["abind", "assertthat", "azidentity", "AzureAuth", "AzureKeyVault", "AzureStor", "AzureTableStor", "brio", "cachem", "callr", "cli", "data.table", "DBI", "devtools", "digest", "doParallel", "esgtoolkit", "FLSSS", "foreach", "fs", "git2r", "httr", "httr2", "jsonlite", "lgr", "loadfast", "lubridate", "memoise", "methods", "NlcOptim", "odbc", "ompr", "ompr.roi", "openxlsx", "parallel", "partitions", "pdftools", "PerformanceAnalytics", "plumber", "polars", "pool", "progress", "purrr", "quadprog", "R6", "rappdirs", "Rblpapi", "RcppDE", "RcppSimdJson", "readr", "readxl", "renv", "Rglpk", "rlang", "rmgarch", "ROI.plugin.highs", "rugarch", "rvest", "snakecase", "stats", "stringr", "testthat", "tools", "tryCatchLog", "utils", "uuid", "withr", "xml2", "xts", "YieldCurve", "zeallot", "zoo"]

[selection]
programs = 100
coverage = 0.9
samples = 3
coverage_of_run = { finbench = 0.7959, dsbench = 0.7706, biobench = 0.7692 }
captured_of_run = { finbench = 0.7439, dsbench = 0.6693, biobench = 0.6797 }

